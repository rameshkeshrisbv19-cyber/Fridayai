name: Build FridayAI Debug APK

# You do NOT need a personal access token for this. GitHub builds the APK on
# its own runners with a temporary token it issues itself for every run.

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [ main, master ]

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Android Gradle Plugin 8.x requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Find the Gradle project (works whether it is at the repo root or in a subfolder)
        id: proj
        run: |
          if [ -f settings.gradle ]; then
            DIR="."
          elif [ -f friday-android-studio/settings.gradle ]; then
            DIR="friday-android-studio"
          else
            DIR="$(dirname "$(find . -name settings.gradle -not -path '*/build/*' | head -n 1)")"
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project directory: $DIR"

      - name: Point Gradle at the preinstalled Android SDK and accept licences
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > "${{ steps.proj.outputs.dir }}/local.properties"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          echo "Using Android SDK at $SDK"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show what was built
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FridayAI-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Optional: a properly SIGNED release APK.
  # It runs only when you have added these four repository secrets:
  #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
  # Without them the job simply skips, and the debug APK above is all you need.
  # ---------------------------------------------------------------------------
  build-release:
    name: Build signed release APK (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Find the Gradle project
        id: proj
        run: |
          if [ -f settings.gradle ]; then
            DIR="."
          elif [ -f friday-android-studio/settings.gradle ]; then
            DIR="friday-android-studio"
          else
            DIR="$(dirname "$(find . -name settings.gradle -not -path '*/build/*' | head -n 1)")"
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Point Gradle at the preinstalled Android SDK and accept licences
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > "${{ steps.proj.outputs.dir }}/local.properties"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Restore your signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/friday.jks"

      - name: Build signed release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          FRIDAY_STORE_FILE: ${{ runner.temp }}/friday.jks
          FRIDAY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FRIDAY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FRIDAY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload signed release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FridayAI-release-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
