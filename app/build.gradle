plugins {
    id 'com.android.application'
}

android {
    namespace 'com.friday.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.friday.ai"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    /*
     * Optional release signing. GitHub Actions fills these environment
     * variables from repository secrets, so a plain push still builds a
     * normal debug APK and nothing is required from you to get started.
     *
     * Secrets used (only if you want a signed release APK):
     *   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
     */
    signingConfigs {
        release {
            if (System.getenv("FRIDAY_STORE_FILE")) {
                storeFile file(System.getenv("FRIDAY_STORE_FILE"))
                storePassword System.getenv("FRIDAY_STORE_PASSWORD")
                keyAlias System.getenv("FRIDAY_KEY_ALIAS")
                keyPassword System.getenv("FRIDAY_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("FRIDAY_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
